---
- name: Installer nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Déployer la page d'accueil
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Redémarrer nginx

- name: Démarrer et activer nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
